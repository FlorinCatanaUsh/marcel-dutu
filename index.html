<body class="home-page">
<style>
body.home-page{background:#211811;margin:0}
.poster-page{width:100%;max-width:1100px;margin:0 auto;position:relative;line-height:0;box-shadow:0 12px 45px rgba(0,0,0,.4)}
.poster-page picture,.poster-page img{display:block;width:100%;height:auto}
.poster-hotspots{position:absolute;inset:0;display:block}
.poster-hotspots a{position:absolute;display:flex;align-items:center;justify-content:center;line-height:normal;background:transparent;border-radius:0}
.poster-hotspots a:focus-visible{outline:3px solid #d2aa65;outline-offset:2px;background:rgba(255,255,255,.08)}
.poster-quote{position:absolute;left:7%;right:7%;top:89%;height:8%;display:flex;align-items:center;justify-content:center;padding:4px 8px;text-align:center;pointer-events:none}
.poster-quote .quote-text{max-width:900px;margin:0;color:#fff0d8;font:italic clamp(12px,2.6vw,26px)/1.3 Georgia,'Times New Roman',serif;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.8);opacity:1;transition:opacity .6s ease}
.poster-quote .quote-text.is-fading{opacity:0}
.poster-tabs{position:absolute;left:1%;right:9%;top:13.8%;height:3.8%;display:flex;align-items:stretch;gap:0}
.poster-tabs a{position:relative;inset:auto;height:100%;width:25%;color:#fff8e9;font:700 clamp(10px,1.8vw,19px)/1.1 Georgia,serif;letter-spacing:.035em;text-align:center;text-shadow:0 2px 5px rgba(0,0,0,.95),0 0 8px rgba(0,0,0,.8);padding:3px 2px;border:0;white-space:nowrap}
.poster-tabs a:hover,.poster-tabs a:focus-visible{background:rgba(28,18,12,.42);color:#ffe0a0}
.poster-call{left:5%;bottom:9.5%;width:44%;height:7%}
.poster-whatsapp{right:5%;bottom:9.5%;width:44%;height:7%}
@media(max-width:699px){
 .poster-tabs{top:13.8%;height:3.8%;left:1%;right:9%}
 .poster-tabs a{font-size:clamp(9px,2.65vw,16px);letter-spacing:0;padding:2px 1px}
 .poster-quote{top:89%;height:7%;left:6%;right:6%;padding:2px 5px}
 .poster-quote .quote-text{font-size:clamp(11px,3.2vw,17px);line-height:1.2}
 .poster-call,.poster-whatsapp{bottom:9.5%;height:7%}
}
@media(min-width:700px){.poster-tabs{top:13.8%;height:4.2%;left:1%;right:9%}.poster-tabs a{font-size:clamp(13px,1.6vw,20px)}.poster-call,.poster-whatsapp{bottom:9.5%;height:7%}}
@media(prefers-reduced-motion:reduce){.poster-quote .quote-text{transition:none}}
</style>

<div class="poster-quote" aria-label="Citate despre artă"><p class="quote-text" id="art-quote" aria-live="polite">„Arta începe acolo unde cuvintele nu mai sunt de ajuns.”</p></div>
</nav>
</main>
<script>
(function(){
  const quoteEl = document.getElementById('art-quote');
  if (!quoteEl) return;
  const quotes = [
    'Arta începe acolo unde cuvintele nu mai sunt de ajuns.',
    'Culorile nu umplu doar pânza, ci dau glas emoțiilor pe care sufletul nu le poate rosti.',
    'Un tablou nu este terminat când artistul lasă pensula, ci când cineva descoperă în el o parte din sine.',
    'Frumusețea artei nu stă doar în ceea ce vezi, ci în ceea ce simți privind.',
    'Artistul nu reproduce lumea. El ne invită să o privim cu alți ochi.',
    'Timpul trece, dar emoția adevărată rămâne vie în artă.',
    'Fiecare operă autentică poartă o amprentă pe care nimeni altcineva nu o poate reproduce.',
    'În fața unui tablou, uneori tăcerea spune mai mult decât o mie de cuvinte.',
    'O operă de artă este o clipă de viață transformată în ceva ce poate dăinui peste generații.',
    'Nu alegi un tablou doar pentru locul pe care îl va ocupa pe perete, ci pentru locul pe care îl va ocupa în sufletul tău.'
  ];
  let index = 0;
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.setInterval(function(){
    index = (index + 1) % quotes.length;
    if (reducedMotion) {
      quoteEl.textContent = '„' + quotes[index] + '”';
      return;
    }
    quoteEl.classList.add('is-fading');
    window.setTimeout(function(){
      quoteEl.textContent = '„' + quotes[index] + '”';
      quoteEl.classList.remove('is-fading');
    }, 600);
  }, 3600);
})();
</script>
