<style>
:root{--ink:#3b2119;--gold:#c59a55;--cream:#f7f4ed;--green:#128b43}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body.home-page{margin:0;min-height:100vh;background:#211811;color:var(--cream);font-family:Georgia,'Times New Roman',serif}
.home-page a{color:inherit;text-decoration:none}
.home-shell{min-height:100vh;padding:clamp(12px,2.4vw,30px);display:flex;align-items:stretch;justify-content:center}
.glass-poster{position:relative;isolation:isolate;overflow:hidden;width:min(100%,1100px);min-height:calc(100vh - clamp(24px,4.8vw,60px));margin:auto;border:1px solid rgba(255,255,255,.75);border-radius:18px;background:#2b2119;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18),inset 0 0 20px rgba(255,255,255,.24),0 18px 60px rgba(0,0,0,.45)}
.glass-poster:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(22,14,10,.3),rgba(20,13,9,.05) 28%,rgba(15,10,7,.12) 58%,rgba(15,10,7,.86)),url('marcel-dutu-home-bg.jpg') center 44%/cover no-repeat}
.glass-poster:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.14) 17%,transparent 27%,transparent 64%,rgba(255,255,255,.1) 77%,transparent 86%);box-shadow:inset 0 0 0 8px rgba(255,255,255,.07)}
.home-header{padding:clamp(22px,4vw,48px) clamp(18px,5vw,64px) 18px;text-align:center;background:linear-gradient(180deg,rgba(250,249,245,.97),rgba(241,237,228,.93));color:var(--ink);border-bottom:1px solid rgba(255,255,255,.8);position:relative}
.home-brand{display:inline-block;font-size:clamp(38px,7.2vw,82px);font-weight:bold;line-height:.98;letter-spacing:-.045em;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.home-subtitle{margin:9px 0 0;font:500 clamp(11px,2.2vw,21px)/1.35 Arial,sans-serif;letter-spacing:.19em;text-transform:uppercase}
.header-ornament{display:flex;align-items:center;gap:14px;margin:15px auto 12px;max-width:680px;color:#9d9b96}
.header-ornament:before,.header-ornament:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#a7a39a,transparent)}
.header-ornament span{font-size:20px}
.home-tabs{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:0}
.home-tabs a{padding:8px clamp(9px,2vw,24px);font:700 clamp(10px,1.65vw,16px)/1.3 Georgia,serif;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:color .2s,background .2s}
.home-tabs a+a{border-left:1px solid var(--gold)}
.home-tabs a:hover,.home-tabs a:focus-visible{color:#8b4034;background:rgba(255,255,255,.45)}
.poster-content{display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(18px,3vw,34px) clamp(18px,5vw,60px) clamp(22px,4vw,40px);min-height:clamp(500px,68vh,850px)}
.poster-tagline{margin:0 auto 14px;max-width:650px;font-size:clamp(18px,3.2vw,30px);line-height:1.24;text-shadow:0 2px 10px #000}
.poster-rule{width:140px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto 22px}
.poster-spacer{flex:1 1 auto;min-height:110px}
.poster-contact-copy{margin:0 0 18px;font-size:clamp(13px,2vw,18px);line-height:1.5;text-shadow:0 2px 8px #000}
.contact-buttons{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;width:100%}
.contact-button{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:min(250px,42%);min-height:62px;padding:14px 26px;border-radius:999px;border:1px solid rgba(255,255,255,.8);font:700 clamp(16px,2.3vw,24px)/1 Arial,sans-serif;box-shadow:inset 0 2px 5px rgba(255,255,255,.7),inset 0 -5px 9px rgba(0,55,20,.24),0 4px 0 #126c30,0 9px 22px rgba(0,0,0,.32);transition:transform .18s,filter .18s}
.contact-button:before{content:"";position:absolute;z-index:-1;inset:1px 1px 48%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.04))}
.contact-button.call{background:linear-gradient(180deg,#61d66c,#23a747 56%,#08752e);color:white}
.contact-button.whatsapp{background:linear-gradient(180deg,#a0f2b0,#4bd77b 54%,#1bb75b);color:#07542b;box-shadow:inset 0 2px 5px rgba(255,255,255,.75),inset 0 -5px 9px rgba(0,75,30,.18),0 4px 0 #168646,0 9px 22px rgba(0,0,0,.28)}
.contact-button:hover,.contact-button:focus-visible{transform:translateY(-2px);filter:brightness(1.07)}
.contact-button:active{transform:translateY(2px)}
.contact-button svg{width:25px;height:25px;flex:0 0 25px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.glass-reflection{position:absolute;inset:8px;border:1px solid rgba(255,255,255,.16);border-radius:12px;pointer-events:none}
@media(min-width:900px){.poster-content{min-height:calc(100vh - 250px)}}
@media(max-width:600px){.home-shell{padding:7px}.glass-poster{min-height:calc(100svh - 14px);border-radius:12px}.home-header{padding:22px 10px 16px}.home-brand{font-size:clamp(37px,10vw,55px)}.home-subtitle{font-size:10px;letter-spacing:.13em}.header-ornament{margin:10px auto 8px}.home-tabs a{padding:8px 8px;font-size:10px;letter-spacing:.045em}.home-tabs a+a{border-left:1px solid var(--gold)}.poster-content{min-height:calc(100svh - 220px);padding:20px 14px 24px;background:linear-gradient(180deg,rgba(20,13,8,.06),rgba(15,10,7,.18) 50%,rgba(15,10,7,.5))}.poster-tagline{font-size:clamp(17px,4.8vw,24px);max-width:340px}.poster-rule{margin:12px auto 18px}.poster-spacer{min-height:95px}.poster-contact-copy{font-size:13px;margin-bottom:14px}.contact-buttons{gap:9px;flex-wrap:nowrap}.contact-button{min-width:0;flex:1 1 0;max-width:230px;min-height:48px;padding:10px 9px;gap:6px;font-size:clamp(11px,3.5vw,15px);white-space:nowrap}.contact-button svg{width:19px;height:19px;flex-basis:19px}}
@media(max-width:360px){.home-tabs a{font-size:9px;padding:7px 6px}.contact-buttons{gap:6px}.contact-button{font-size:11px;padding:9px 6px;gap:4px}.contact-button svg{width:16px;height:16px;flex-basis:16px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.contact-button,.home-tabs a{transition:none}}
</style>
</head>

<style>

@media(max-width:699px){.poster-tabs{top:12%;height:5.5%;left:2%;right:2%}.poster-tabs a{font-size:clamp(9px,2.65vw,16px);letter-spacing:0;padding:2px 1px}.poster-quote{top:76%;height:12%;left:6%;right:6%;padding:3px 5px}.poster-quote .quote-text{font-size:clamp(12px,3.6vw,20px);line-height:1.25}}

@media(max-width:600px){.quote-strip{padding:18px 16px 22px;min-height:105px}.quote-text{font-size:clamp(15px,4vw,19px)}}

<script>
(function(){
  const quoteEl = document.getElementById('art-quote');
  if (!quoteEl) return;
  const quotes = [
    'Arta începe acolo unde cuvintele nu mai sunt de ajuns.',
    'Culorile nu umplu doar pânza, ci dau glas emoțiilor pe care sufletul nu le poate rosti.',
    'Un tablou nu este terminat când artistul lasă pensula, ci când cineva descoperă în el o parte din sine.',
    'Frumusețea artei nu stă doar în ceea ce vezi, ci în ceea ce simți privind.',
    'Artistul nu reproduce lumea. El ne invită să o privim cu alți ochi.',
    'Timpul trece, dar emoția adevărată rămâne vie în artă.',
    'Fiecare operă autentică poartă o amprentă pe care nimeni altcineva nu o poate reproduce.',
    'În fața unui tablou, uneori tăcerea spune mai mult decât o mie de cuvinte.',
    'O operă de artă este o clipă de viață transformată în ceva ce poate dăinui peste generații.',
    'Nu alegi un tablou doar pentru locul pe care îl va ocupa pe perete, ci pentru locul pe care îl va ocupa în sufletul tău.'
  ];
  let index = 0;
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.setInterval(function(){
    index = (index + 1) % quotes.length;
    if (reducedMotion) {
      quoteEl.textContent = '„' + quotes[index] + '”';
      return;
    }
    quoteEl.classList.add('is-fading');
    window.setTimeout(function(){
      quoteEl.textContent = '„' + quotes[index] + '”';
      quoteEl.classList.remove('is-fading');
    }, 600);
  }, 3600);
})();
</script>
